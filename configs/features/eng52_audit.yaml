schema_version: 1
audit_id: ENG52-A
benchmark:
  market: Binance Spot BTCUSDT
  timeframe: 1h
  availability: after completion of bar t
  target: next-real-hour log return
  gap_policy: no lagged, rolling, exponentially weighted, or pivot state may bridge a missing UTC hour
status_values:
  - SAFE
  - SAFE_WITH_ADAPTATION
  - REJECT
summary_counts:
  SAFE: 0
  SAFE_WITH_ADAPTATION: 52
  REJECT: 0

gap_safe_defaults: &gap_safe_defaults
  causal_at_decision_time: true
  valid_on_1h_ohlcv: true
  requires_gap_safe_adaptation: true
  status: SAFE_WITH_ADAPTATION
  required_adaptation: >-
    Preserve the documented bar-open formula and parameters, but validate every shifted and
    rolling input against exact consecutive UTC-hour timestamps; reset state at a gap and emit
    missing until the complete real-hour history is available.

features:
  - <<: *gap_safe_defaults
    feature_name: absret_ema_ratio_20_100
    source_file: references/features/source/absret_ema_ratio_20_100.py
    documented_definition_formula: "EMA_20(abs(ln(close[t-1] / close[t-2]))) / (EMA_100(abs(ln(close[t-1] / close[t-2]))) + EPS)"
    required_raw_inputs: [close]
    required_historical_lookback: "101 hourly rows; documented leading warm-up 101"
    overlap_with_f0: "Conceptual overlap with F0 rolling volatility features; not an exact duplicate."
    leakage_or_data_availability_risk: "Causal as documented; positional shifts and EMA state would otherwise bridge missing hours."

  - <<: *gap_safe_defaults
    feature_name: amihud_illiquidity_20
    source_file: references/features/source/amihud_illiquidity_20.py
    documented_definition_formula: "mean_20(abs(ln(close[t-1] / close[t-2])) / (close[t-1] * volume[t-1]))"
    required_raw_inputs: [close, volume]
    required_historical_lookback: "21 hourly rows; documented leading warm-up 21"
    overlap_with_f0: "Uses return and volume information also present in F0, but defines a distinct liquidity ratio."
    leakage_or_data_availability_risk: "Causal; requires positive close/volume, consecutive hours, and Binance base-asset volume semantics."
    required_adaptation: >-
      Apply the standard consecutive-hour reset/masking rule and bind volume to the canonical
      Binance base-asset volume column without changing the documented formula.

  - <<: *gap_safe_defaults
    feature_name: atr_pct_14
    source_file: references/features/source/atr_pct_14.py
    documented_definition_formula: "ATR_14_shift1[t] / (close[t-1] + EPS)"
    required_raw_inputs: [high, low, close]
    required_historical_lookback: "15 hourly rows; documented leading warm-up 15"
    overlap_with_f0: "Conceptual overlap with F0 high-low range and rolling volatility; not exact."
    leakage_or_data_availability_risk: "Causal as documented; ATR recursion and shifted close must reset after missing hours."

  - <<: *gap_safe_defaults
    feature_name: atr_ratio_14_63
    source_file: references/features/source/atr_ratio_14_63.py
    documented_definition_formula: "ATR_14_shift1[t] / (ATR_63_shift1[t] + EPS)"
    required_raw_inputs: [high, low, close]
    required_historical_lookback: "64 hourly rows; documented leading warm-up 64"
    overlap_with_f0: "Conceptual volatility-regime overlap with F0 rolling volatility; not exact."
    leakage_or_data_availability_risk: "Causal; both ATR states would otherwise continue across a missing hour."

  - <<: *gap_safe_defaults
    feature_name: band_bb_percB_20_2
    source_file: references/features/source/band_bb_percB_20_2.py
    documented_definition_formula: "(close[t-1] - SMA_20(close.shift(1)) + 2*STD_20) / (4*STD_20), ddof=0; flat band = 0.5"
    required_raw_inputs: [close]
    required_historical_lookback: "20 hourly rows; documented leading warm-up 20"
    overlap_with_f0: "No exact F0 duplicate; price-position concept is related to close_position_in_range."
    leakage_or_data_availability_risk: "Causal; row-count rolling statistics would otherwise bridge hourly gaps."

  - <<: *gap_safe_defaults
    feature_name: bb_excursion_20_2
    source_file: references/features/source/bb_excursion_20_2.py
    documented_definition_formula: "min(percent_B_20_2, 0) + max(percent_B_20_2 - 1, 0)"
    required_raw_inputs: [close]
    required_historical_lookback: "20 hourly rows; documented leading warm-up 20"
    overlap_with_f0: "No exact F0 duplicate."
    leakage_or_data_availability_risk: "Causal; its Bollinger window must not span a missing hour."

  - <<: *gap_safe_defaults
    feature_name: bb_width_rel_20
    source_file: references/features/source/bb_width_rel_20.py
    documented_definition_formula: "(upper_BB_20_2 - lower_BB_20_2) / (middle_BB_20 + EPS), STD ddof=0"
    required_raw_inputs: [close]
    required_historical_lookback: "20 hourly rows; documented leading warm-up 20"
    overlap_with_f0: "Conceptual volatility overlap with F0 rolling volatility; not exact."
    leakage_or_data_availability_risk: "Causal; rolling mean/std must use a complete consecutive-hour window."

  - <<: *gap_safe_defaults
    feature_name: bearish_engulf_score
    source_file: references/features/source/bearish_engulf_score.py
    documented_definition_formula: "I[bearish engulfing on bars t-2,t-1] * abs(close[t-1]-open[t-1]) / (ATR_14_shift1[t] + EPS)"
    required_raw_inputs: [open, high, low, close]
    required_historical_lookback: "15 hourly rows; documented leading warm-up 15"
    overlap_with_f0: "Uses candle return/range information represented in F0, but is a distinct pattern score."
    leakage_or_data_availability_risk: "Causal; engulfing bars must be adjacent real hours and ATR must reset after gaps."

  - <<: *gap_safe_defaults
    feature_name: body_signed_to_tr
    source_file: references/features/source/body_signed_to_tr.py
    documented_definition_formula: "clip((close[t-1] - open[t-1]) / (TR[t-1] + EPS), -1, 1)"
    required_raw_inputs: [open, high, low, close]
    required_historical_lookback: "2 hourly rows for true range; documented leading warm-up 1"
    overlap_with_f0: "Strong conceptual overlap with F0 candle_log_return and high_low_range_pct; not exact."
    leakage_or_data_availability_risk: "Causal; prior-close true range must use the exact preceding real hour."

  - <<: *gap_safe_defaults
    feature_name: body_to_tr
    source_file: references/features/source/body_to_tr.py
    documented_definition_formula: "abs(close[t-1] - open[t-1]) / (TR[t-1] + EPS)"
    required_raw_inputs: [open, high, low, close]
    required_historical_lookback: "2 hourly rows for true range; documented leading warm-up 1"
    overlap_with_f0: "Strong conceptual overlap with F0 candle_log_return and high_low_range_pct; not exact."
    leakage_or_data_availability_risk: "Causal; prior-close true range must use the exact preceding real hour."

  - <<: *gap_safe_defaults
    feature_name: breakdown_strength_20
    source_file: references/features/source/breakdown_strength_20.py
    documented_definition_formula: "max(min(low[t-21:t-1]) - close[t-1], 0) / (ATR_14_shift1[t] + EPS)"
    required_raw_inputs: [high, low, close]
    required_historical_lookback: "21 hourly rows; documented leading warm-up 21"
    overlap_with_f0: "No exact F0 duplicate."
    leakage_or_data_availability_risk: "Causal; prior channel and ATR must be complete consecutive-hour histories."

  - <<: *gap_safe_defaults
    feature_name: breakout_strength_20
    source_file: references/features/source/breakout_strength_20.py
    documented_definition_formula: "max(close[t-1] - max(high[t-21:t-1]), 0) / (ATR_14_shift1[t] + EPS)"
    required_raw_inputs: [high, low, close]
    required_historical_lookback: "21 hourly rows; documented leading warm-up 21"
    overlap_with_f0: "No exact F0 duplicate."
    leakage_or_data_availability_risk: "Causal; prior channel and ATR must be complete consecutive-hour histories."

  - <<: *gap_safe_defaults
    feature_name: bullish_engulf_score
    source_file: references/features/source/bullish_engulf_score.py
    documented_definition_formula: "I[bullish engulfing on bars t-2,t-1] * abs(close[t-1]-open[t-1]) / (ATR_14_shift1[t] + EPS)"
    required_raw_inputs: [open, high, low, close]
    required_historical_lookback: "15 hourly rows; documented leading warm-up 15"
    overlap_with_f0: "Uses candle return/range information represented in F0, but is a distinct pattern score."
    leakage_or_data_availability_risk: "Causal; engulfing bars must be adjacent real hours and ATR must reset after gaps."

  - <<: *gap_safe_defaults
    feature_name: cand_up_down_vol_ratio_20
    source_file: references/features/source/cand_up_down_vol_ratio_20.py
    documented_definition_formula: "sum_20(volume[t-1] where close[t-1] > open[t-1]) / (sum_20(volume[t-1] where close[t-1] < open[t-1]) + EPS)"
    required_raw_inputs: [open, close, volume]
    required_historical_lookback: "20 hourly rows; documented leading warm-up 19"
    overlap_with_f0: "Uses volume and candle direction present in F0 components, but is not a duplicate."
    leakage_or_data_availability_risk: "Causal; requires consecutive hours and consistent Binance base-asset volume semantics."
    required_adaptation: >-
      Apply the standard consecutive-hour reset/masking rule and bind volume to the canonical
      Binance base-asset volume column without changing the documented formula.

  - <<: *gap_safe_defaults
    feature_name: channel_pos_20
    source_file: references/features/source/channel_pos_20.py
    documented_definition_formula: "clip((close[t-1] - min_20(low.shift(1))) / (max_20(high.shift(1)) - min_20(low.shift(1)) + EPS), 0, 1)"
    required_raw_inputs: [high, low, close]
    required_historical_lookback: "20 hourly rows; documented leading warm-up 20"
    overlap_with_f0: "Conceptual overlap with F0 close_position_in_range at a different horizon."
    leakage_or_data_availability_risk: "Causal; channel extrema require a complete consecutive-hour window."

  - <<: *gap_safe_defaults
    feature_name: close_location_value
    source_file: references/features/source/close_location_value.py
    documented_definition_formula: "((close[t-1]-low[t-1]) - (high[t-1]-close[t-1])) / (high[t-1]-low[t-1]); flat range = 0"
    required_raw_inputs: [high, low, close]
    required_historical_lookback: "1 completed hourly bar; documented leading warm-up 1"
    overlap_with_f0: "Exact affine duplicate of F0 close_position_in_range: CLV = 2*close_position_in_range - 1, including flat-range conventions."
    leakage_or_data_availability_risk: "Causal; the shifted completed bar must be the exact preceding UTC hour."

  - <<: *gap_safe_defaults
    feature_name: dmi_balance_14
    source_file: references/features/source/dmi_balance_14.py
    documented_definition_formula: "(DI_plus_14 - DI_minus_14) / (DI_plus_14 + DI_minus_14 + EPS), Wilder alpha=1/14"
    required_raw_inputs: [high, low, close]
    required_historical_lookback: "15 hourly rows; documented leading warm-up 15"
    overlap_with_f0: "No exact F0 duplicate."
    leakage_or_data_availability_risk: "Causal; directional-movement and ATR recursive state must reset after a missing hour."

  - <<: *gap_safe_defaults
    feature_name: dollar_vol_rel_20
    source_file: references/features/source/dollar_vol_rel_20.py
    documented_definition_formula: "(close[t-1] * volume[t-1]) / (EMA_20((close*volume).shift(1))[t] + EPS)"
    required_raw_inputs: [close, volume]
    required_historical_lookback: "20 hourly rows; documented leading warm-up 20"
    overlap_with_f0: "Conceptual volume overlap with F0 relative_volume_24h; not exact."
    leakage_or_data_availability_risk: "Causal; dollar volume is approximated from close times Binance base volume, and EMA must reset at gaps."
    required_adaptation: >-
      Apply the standard consecutive-hour reset/masking rule and bind volume to Binance base-asset
      volume; retain the documented close-times-volume approximation.

  - <<: *gap_safe_defaults
    feature_name: downside_semivol_20
    source_file: references/features/source/downside_semivol_20.py
    documented_definition_formula: "sqrt(mean_20(min(ln(close[t-1] / close[t-2]), 0)^2))"
    required_raw_inputs: [close]
    required_historical_lookback: "21 hourly rows; documented leading warm-up 21"
    overlap_with_f0: "Conceptual overlap with F0 rolling volatility; downside-only and different horizon."
    leakage_or_data_availability_risk: "Causal; return and rolling windows must contain consecutive real hours."

  - <<: *gap_safe_defaults
    feature_name: drawdown_from_peak_60
    source_file: references/features/source/drawdown_from_peak_60.py
    documented_definition_formula: "(max_60(close.shift(1)) - close[t-1]) / (max_60(close.shift(1)) + EPS)"
    required_raw_inputs: [close]
    required_historical_lookback: "60 hourly rows; documented leading warm-up 60"
    overlap_with_f0: "No exact F0 duplicate."
    leakage_or_data_availability_risk: "Causal; rolling peak must be formed from 60 consecutive real hours."

  - <<: *gap_safe_defaults
    feature_name: efficiency_ratio_20
    source_file: references/features/source/efficiency_ratio_20.py
    documented_definition_formula: "abs(close[t-1] - close[t-21]) / (sum_20(abs(delta(close.shift(1)))) + EPS)"
    required_raw_inputs: [close]
    required_historical_lookback: "21 hourly rows; documented leading warm-up 21"
    overlap_with_f0: "Uses return/momentum information represented in F0, but is not an exact feature."
    leakage_or_data_availability_risk: "Causal; endpoint lag and path-length window must not bridge a gap."

  - <<: *gap_safe_defaults
    feature_name: ema_gap_atr_20
    source_file: references/features/source/ema_gap_atr_20.py
    documented_definition_formula: "(close[t-1] - EMA_20(close.shift(1))[t]) / (ATR_14_shift1[t] + EPS)"
