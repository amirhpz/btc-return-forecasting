schema_version: 1
feature:
  id: ret_vol_corr_30
  version: 1.0.0
  status: validated
  category: volume_price_relation
  module: features.ret_vol_corr_30
  implementation_file: features/ret_vol_corr_30.py
  callable: compute
  output_column: ret_vol_corr_30
  mode: signed
  description: Computes the 30-observation rolling Pearson correlation between absolute completed log returns and
    completed-bar volume.
formula: corr_30(|ln(close[t-1]/close[t-2])|, volume[t-1])
parameters:
  window: 30
  degenerate_window_value: 0.0
data_contract:
  required_columns:
  - close
  - volume
  evaluation_time: bar_open
  uses_current_bar: false
  current_bar_fields: []
  uses_future_data: false
  requires_chronological_input: true
  expected_leading_warmup_rows: 31
  volume_requirement: same_volume_definition_in_training_and_metatrader
output_contract:
  native_range:
    minimum: -1.0
    maximum: 1.0
  interpretation: Positive values associate larger price moves with higher volume; negative values indicate the
    opposite.
  missing_value_policy: leading_warmup_only
normalization:
  mode: signed
  fit_scope: train_only_per_symbol
validation:
  compile_ok: true
  index_preserved: true
  prefix_causal: true
  future_perturbation_invariant: true
  current_bar_policy_verified: true
notes:
- A mature zero-variance or numerically degenerate window is assigned neutral correlation 0. Volume definition must
  be consistent.
