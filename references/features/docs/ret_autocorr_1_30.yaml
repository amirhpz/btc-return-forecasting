schema_version: 1
feature:
  id: ret_autocorr_1_30
  version: 1.0.0
  status: validated
  category: serial_dependence
  module: features.ret_autocorr_1_30
  implementation_file: features/ret_autocorr_1_30.py
  callable: compute
  output_column: ret_autocorr_1_30
  mode: signed
  description: Computes the 30-observation rolling lag-1 Pearson autocorrelation of completed log returns.
formula: corr_30(return[t], return[t-1])
parameters:
  window: 30
  lag: 1
  degenerate_window_value: 0.0
data_contract:
  required_columns:
  - close
  evaluation_time: bar_open
  uses_current_bar: false
  current_bar_fields: []
  uses_future_data: false
  requires_chronological_input: true
  expected_leading_warmup_rows: 32
  volume_requirement: null
output_contract:
  native_range:
    minimum: -1.0
    maximum: 1.0
  interpretation: Positive values indicate return persistence; negative values indicate mean-reverting alternation.
  missing_value_policy: leading_warmup_only
normalization:
  mode: signed
  fit_scope: train_only_per_symbol
validation:
  compile_ok: true
  index_preserved: true
  prefix_causal: true
  future_perturbation_invariant: true
  current_bar_policy_verified: true
notes:
- A mature zero-variance window is assigned neutral correlation 0 instead of NaN.
