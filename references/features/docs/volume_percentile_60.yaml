schema_version: 1
feature:
  id: volume_percentile_60
  version: 1.0.0
  status: validated
  category: volume_regime
  module: features.volume_percentile_60
  implementation_file: features/volume_percentile_60.py
  callable: compute
  output_column: volume_percentile_60
  mode: positive
  description: Ranks the last completed volume against the preceding 60 completed volume observations.
formula: count(volume[t-61:t-1] <= volume[t-1]) / 60
parameters:
  window: 60
  tie_policy: weak
data_contract:
  required_columns:
  - volume
  evaluation_time: bar_open
  uses_current_bar: false
  current_bar_fields: []
  uses_future_data: false
  requires_chronological_input: true
  expected_leading_warmup_rows: 61
  volume_requirement: same_volume_definition_in_training_and_metatrader
output_contract:
  native_range:
    minimum: 0.0
    maximum: 1.0
  interpretation: Values near 1 indicate unusually high volume relative to the preceding 60 bars.
  missing_value_policy: leading_warmup_only
normalization:
  mode: positive
  fit_scope: train_only_per_symbol
validation:
  compile_ok: true
  index_preserved: true
  prefix_causal: true
  future_perturbation_invariant: true
  current_bar_policy_verified: true
notes:
- Volume definition must be identical in training and live inference.
