schema_version: 1
feature:
  id: ema_slope_atr_20_5
  version: 1.0.0
  status: validated
  category: trend
  module: features.ema_slope_atr_20_5
  implementation_file: features/ema_slope_atr_20_5.py
  callable: compute
  output_column: ema_slope_atr_20_5
  mode: signed
  description: Measures the five-bar slope of the 20-span EMA in average per-bar ATR units.
formula: (EMA_20[t] - EMA_20[t-5]) / (5 * ATR_14_shift1[t] + EPS)
parameters:
  ema_span: 20
  slope_lag: 5
  atr_period: 14
  ema_adjust: false
data_contract:
  required_columns:
  - close
  - high
  - low
  evaluation_time: bar_open
  uses_current_bar: false
  current_bar_fields: []
  uses_future_data: false
  requires_chronological_input: true
  expected_leading_warmup_rows: 25
  volume_requirement: null
output_contract:
  native_range:
    minimum: null
    maximum: null
  interpretation: Positive values indicate an upward EMA slope; negative values indicate a downward slope.
  missing_value_policy: leading_warmup_only
normalization:
  mode: signed
  fit_scope: train_only_per_symbol
validation:
  compile_ok: true
  index_preserved: true
  prefix_causal: true
  future_perturbation_invariant: true
  current_bar_policy_verified: true
notes: []
