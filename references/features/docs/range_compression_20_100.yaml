schema_version: 1
feature:
  id: range_compression_20_100
  version: 1.0.0
  status: validated
  category: volatility_regime
  module: features.range_compression_20_100
  implementation_file: features/range_compression_20_100.py
  callable: compute
  output_column: range_compression_20_100
  mode: positive
  description: Compares the 20-bar high-low range with the 100-bar high-low range.
formula: (max_20(high)-min_20(low)) / (max_100(high)-min_100(low)+EPS)
parameters:
  short_window: 20
  long_window: 100
data_contract:
  required_columns:
  - high
  - low
  evaluation_time: bar_open
  uses_current_bar: false
  current_bar_fields: []
  uses_future_data: false
  requires_chronological_input: true
  expected_leading_warmup_rows: 100
  volume_requirement: null
output_contract:
  native_range:
    minimum: 0.0
    maximum: 1.0
  interpretation: Low values indicate short-term compression; values near 1 indicate the short range spans most
    of the long range.
  missing_value_policy: leading_warmup_only
normalization:
  mode: positive
  fit_scope: train_only_per_symbol
validation:
  compile_ok: true
  index_preserved: true
  prefix_causal: true
  future_perturbation_invariant: true
  current_bar_policy_verified: true
notes: []
