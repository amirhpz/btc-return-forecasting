schema_version: 1
feature:
  id: log_range_over_vol_100
  version: 1.0.0
  status: validated
  category: trend_quality
  module: features.log_range_over_vol_100
  implementation_file: features/log_range_over_vol_100.py
  callable: compute
  output_column: log_range_over_vol_100
  mode: positive
  description: Compares the 100-bar log-price range with the standard deviation of one-bar log returns.
formula: (max_100(log_close) - min_100(log_close)) / (std_100(log_return, ddof=1) + EPS)
parameters:
  window: 100
  std_ddof: 1
data_contract:
  required_columns:
  - close
  evaluation_time: bar_open
  uses_current_bar: false
  current_bar_fields: []
  uses_future_data: false
  requires_chronological_input: true
  expected_leading_warmup_rows: 101
  volume_requirement: null
output_contract:
  native_range:
    minimum: 0.0
    maximum: null
  interpretation: Higher values indicate a large directional range relative to local return noise.
  missing_value_policy: leading_warmup_only
normalization:
  mode: positive
  fit_scope: train_only_per_symbol
validation:
  compile_ok: true
  index_preserved: true
  prefix_causal: true
  future_perturbation_invariant: true
  current_bar_policy_verified: true
notes: []
