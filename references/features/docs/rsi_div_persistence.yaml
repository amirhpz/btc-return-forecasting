schema_version: 1
feature:
  id: rsi_div_persistence
  version: 1.0.0
  status: validated
  category: divergence
  module: features.rsi_div_persistence
  implementation_file: features/rsi_div_persistence.py
  callable: compute
  output_column: rsi_div_persistence
  mode: sparse_signed
  description: Counts the signed consecutive duration of the current hidden RSI divergence state.
formula: signed_run_length(hidden_rsi_divergence_flag)
parameters:
  rsi_period: 14
  pivot_k: 3
  maximum_pivot_age: 60
  minimum_pivot_separation: 5
  trend_filter: true
  trend_length: 50
data_contract:
  required_columns:
  - high
  - low
  - close
  - datetime
  evaluation_time: bar_open
  uses_current_bar: false
  current_bar_fields: []
  uses_future_data: false
  requires_chronological_input: true
  expected_leading_warmup_rows: 0
  volume_requirement: null
output_contract:
  native_range:
    minimum: null
    maximum: null
  interpretation: Positive integers count persistent bullish hidden divergence; negative integers count bearish
    persistence; zero means no active state.
  missing_value_policy: leading_warmup_only
normalization:
  mode: sparse_signed
  fit_scope: train_only_per_symbol
validation:
  compile_ok: true
  index_preserved: true
  prefix_causal: true
  future_perturbation_invariant: true
  current_bar_policy_verified: true
notes: []
