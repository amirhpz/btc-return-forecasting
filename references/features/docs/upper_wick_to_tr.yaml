schema_version: 1
feature:
  id: upper_wick_to_tr
  version: 1.0.0
  status: validated
  category: candlestick_structure
  module: features.upper_wick_to_tr
  implementation_file: features/upper_wick_to_tr.py
  callable: compute
  output_column: upper_wick_to_tr
  mode: positive
  description: Measures the upper wick of the last completed candle relative to its True Range.
formula: (high[t-1] - max(open[t-1], close[t-1])) / (TR[t-1] + EPS)
parameters: {}
data_contract:
  required_columns:
  - open
  - high
  - low
  - close
  evaluation_time: bar_open
  uses_current_bar: false
  current_bar_fields: []
  uses_future_data: false
  requires_chronological_input: true
  expected_leading_warmup_rows: 1
  volume_requirement: null
output_contract:
  native_range:
    minimum: 0.0
    maximum: 1.0
  interpretation: Higher values indicate stronger upper-wick rejection relative to the total true range.
  missing_value_policy: leading_warmup_only
normalization:
  mode: positive
  fit_scope: train_only_per_symbol
validation:
  compile_ok: true
  index_preserved: true
  prefix_causal: true
  future_perturbation_invariant: true
  current_bar_policy_verified: true
notes: []
