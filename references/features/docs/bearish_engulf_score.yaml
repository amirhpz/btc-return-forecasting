schema_version: 1
feature:
  id: bearish_engulf_score
  version: 1.0.0
  status: validated
  category: candlestick_pattern
  module: features.bearish_engulf_score
  implementation_file: features/bearish_engulf_score.py
  callable: compute
  output_column: bearish_engulf_score
  mode: sparse_positive
  description: Scores a completed bearish engulfing pattern by its body size relative to ATR.
formula: I[bearish_engulfing(t-2,t-1)] * |close[t-1]-open[t-1]| / (ATR_14_shift1[t] + EPS)
parameters:
  atr_period: 14
data_contract:
  required_columns:
  - open
  - high
  - low
  - close
  evaluation_time: bar_open
  uses_current_bar: false
  current_bar_fields: []
  uses_future_data: false
  requires_chronological_input: true
  expected_leading_warmup_rows: 15
  volume_requirement: null
output_contract:
  native_range:
    minimum: 0.0
    maximum: null
  interpretation: Zero means no bearish engulfing event; larger values indicate a stronger ATR-scaled pattern.
  missing_value_policy: leading_warmup_only
normalization:
  mode: sparse_positive
  fit_scope: train_only_per_symbol
validation:
  compile_ok: true
  index_preserved: true
  prefix_causal: true
  future_perturbation_invariant: true
  current_bar_policy_verified: true
notes: []
