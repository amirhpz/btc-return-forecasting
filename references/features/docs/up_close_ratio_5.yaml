schema_version: 1
feature:
  id: up_close_ratio_5
  version: 1.0.0
  status: validated
  category: momentum
  module: features.up_close_ratio_5
  implementation_file: features/up_close_ratio_5.py
  callable: compute
  output_column: up_close_ratio_5
  mode: positive
  description: Measures the fraction of the latest five completed close-to-close changes that were positive.
formula: mean_5(I[close[t-1] > close[t-2]])
parameters:
  window: 5
data_contract:
  required_columns:
  - close
  evaluation_time: bar_open
  uses_current_bar: false
  current_bar_fields: []
  uses_future_data: false
  requires_chronological_input: true
  expected_leading_warmup_rows: 4
  volume_requirement: null
output_contract:
  native_range:
    minimum: 0.0
    maximum: 1.0
  interpretation: One means all five changes were positive; zero means none were positive.
  missing_value_policy: leading_warmup_only
normalization:
  mode: positive
  fit_scope: train_only_per_symbol
validation:
  compile_ok: true
  index_preserved: true
  prefix_causal: true
  future_perturbation_invariant: true
  current_bar_policy_verified: true
notes: []
