schema_version: 1
feature:
  id: vol_regime_pct_120
  version: 1.0.0
  status: validated
  category: volatility_regime
  module: features.vol_regime_pct_120
  implementation_file: features/vol_regime_pct_120.py
  callable: compute
  output_column: vol_regime_pct_120
  mode: positive
  description: Ranks current 20-bar realized volatility against the preceding 120 fully formed volatility observations.
formula: count(past_volatility_120 <= current_volatility) / 120
parameters:
  volatility_window: 20
  percentile_window: 120
  std_ddof: 1
  tie_policy: weak
data_contract:
  required_columns:
  - close
  evaluation_time: bar_open
  uses_current_bar: false
  current_bar_fields: []
  uses_future_data: false
  requires_chronological_input: true
  expected_leading_warmup_rows: 141
  volume_requirement: null
output_contract:
  native_range:
    minimum: 0.0
    maximum: 1.0
  interpretation: Values near 1 indicate a high-volatility regime relative to recent history.
  missing_value_policy: leading_warmup_only
normalization:
  mode: positive
  fit_scope: train_only_per_symbol
validation:
  compile_ok: true
  index_preserved: true
  prefix_causal: true
  future_perturbation_invariant: true
  current_bar_policy_verified: true
notes: []
