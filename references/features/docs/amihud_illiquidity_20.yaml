schema_version: 1
feature:
  id: amihud_illiquidity_20
  version: 1.0.0
  status: validated
  category: liquidity
  module: features.amihud_illiquidity_20
  implementation_file: features/amihud_illiquidity_20.py
  callable: compute
  output_column: amihud_illiquidity_20
  mode: positive
  description: Computes the 20-bar Amihud illiquidity estimate using absolute log return per unit of quote notional
    volume.
formula: mean_20(|ln(close[t-1] / close[t-2])| / (close[t-1] * volume[t-1]))
parameters:
  window: 20
data_contract:
  required_columns:
  - close
  - volume
  evaluation_time: bar_open
  uses_current_bar: false
  current_bar_fields: []
  uses_future_data: false
  requires_chronological_input: true
  expected_leading_warmup_rows: 21
  volume_requirement: base_asset_traded_volume_consistent_between_train_and_live
output_contract:
  native_range:
    minimum: 0.0
    maximum: null
  interpretation: Higher values indicate larger price movement per unit of traded notional and therefore lower liquidity.
  missing_value_policy: leading_warmup_only
normalization:
  mode: positive
  fit_scope: train_only_per_symbol
validation:
  compile_ok: true
  index_preserved: true
  prefix_causal: true
  future_perturbation_invariant: true
  current_bar_policy_verified: true
notes:
- Requires strictly positive base-asset traded volume and consistent volume semantics between training and live
  inference.
