schema_version: 1
feature:
  id: tr_to_atr_14
  version: 1.0.0
  status: validated
  category: volatility_shock
  module: features.tr_to_atr_14
  implementation_file: features/tr_to_atr_14.py
  callable: compute
  output_column: tr_to_atr_14
  mode: positive
  description: Compares the last completed candle True Range with its 14-bar ATR.
formula: TR[t-1] / (ATR_14_shift1[t] + EPS)
parameters:
  atr_period: 14
data_contract:
  required_columns:
  - high
  - low
  - close
  evaluation_time: bar_open
  uses_current_bar: false
  current_bar_fields: []
  uses_future_data: false
  requires_chronological_input: true
  expected_leading_warmup_rows: 15
  volume_requirement: null
output_contract:
  native_range:
    minimum: 0.0
    maximum: null
  interpretation: Values above 1 indicate the last completed true range exceeded the recent ATR baseline.
  missing_value_policy: leading_warmup_only
normalization:
  mode: positive
  fit_scope: train_only_per_symbol
validation:
  compile_ok: true
  index_preserved: true
  prefix_causal: true
  future_perturbation_invariant: true
  current_bar_policy_verified: true
notes: []
